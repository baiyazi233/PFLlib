<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Federated Learning Dashboard</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.0.0/dist/socket.io.js"></script>
  <style>
    .nav-tabs .nav-link.active {
      font-weight: bold;
    }

    .card {
      margin-bottom: 20px;
    }

    .metrics-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .metric-card {
      text-align: center;
      padding: 15px;
      border-radius: 8px;
      background-color: #f8f9fa;
    }

    .metric-value {
      font-size: 24px;
      font-weight: bold;
      color: #0d6efd;
    }

    .metric-label {
      font-size: 14px;
      color: #6c757d;
    }
  </style>
</head>

<body>
  <div class="container-fluid py-4">
    <h1 class="text-center mb-4">Federated Learning Dashboard</h1>

    <!-- Navigation Tabs -->
    <ul class="nav nav-tabs mb-4" id="myTab" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="training-tab" data-bs-toggle="tab" data-bs-target="#training" type="button"
          role="tab">Training Mode</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="inference-tab" data-bs-toggle="tab" data-bs-target="#inference" type="button"
          role="tab">Inference Mode</button>
      </li>
    </ul>

    <!-- Tab Content -->
    <div class="tab-content" id="myTabContent">
      <!-- Training Mode -->
      <div class="tab-pane fade show active" id="training" role="tabpanel">
        <div class="row">
          <!-- Training Parameters -->
          <div class="col-md-4">
            <div class="card">
              <div class="card-header">
                <h5 class="card-title mb-0">Training Parameters</h5>
              </div>
              <div class="card-body">
                <form id="trainingForm">
                  <div class="mb-3">
                    <label class="form-label">Dataset</label>
                    <select class="form-select" name="dataset" required>
                      <option value="MNIST">MNIST</option>
                      <option value="CIFAR10">CIFAR10</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Model</label>
                    <select class="form-select" name="model" required>
                      <option value="LeNet">LeNet</option>
                      <option value="CNN">CNN</option>
                      <option value="ResNet18">ResNet18</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Algorithm</label>
                    <select class="form-select" name="algorithm" required>
                      <option value="FedAvg">FedAvg</option>
                      <option value="FedProx">FedProx</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Global Rounds</label>
                    <input type="number" class="form-control" name="global_rounds" value="200" required>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Number of Clients</label>
                    <input type="number" class="form-control" name="num_clients" value="50" required>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Device ID</label>
                    <input type="number" class="form-control" name="device_id" value="0" required>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Number of Clusters (FedCFL)</label>
                    <input type="number" class="form-control" name="num_clusters" value="10" required>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Mu (FedCFL)</label>
                    <input type="number" step="any" class="form-control" name="mu" value="1.0" required>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Lambda (FedCFL)</label>
                    <input type="number" step="any" class="form-control" name="lambda_" value="2.0" required>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Batch Size</label>
                    <input type="number" class="form-control" name="batch_size" value="10" required>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Local Learning Rate</label>
                    <input type="number" step="any" class="form-control" name="local_learning_rate" value="0.01"
                      required>
                  </div>
                  <button type="submit" class="btn btn-primary w-100">Start Training</button>
                </form>
              </div>
            </div>
          </div>

          <!-- Training Metrics -->
          <div class="col-md-8">
            <div class="card">
              <div class="card-header">
                <h5 class="card-title mb-0">Training Metrics</h5>
              </div>
              <div class="card-body">
                <div class="metrics-container">
                  <div class="metric-card">
                    <div class="metric-value" id="trainingTime">-</div>
                    <div class="metric-label">Training Time (s)</div>
                  </div>
                  <div class="metric-card">
                    <div class="metric-value" id="trainingLoss">-</div>
                    <div class="metric-label">Training Loss</div>
                  </div>
                  <div class="metric-card">
                    <div class="metric-value" id="avgAccuracy">-</div>
                    <div class="metric-label">Average Accuracy</div>
                  </div>
                  <div class="metric-card">
                    <div class="metric-value" id="stdAccuracy">-</div>
                    <div class="metric-label">Accuracy Std Dev</div>
                  </div>
                </div>
                <canvas id="trainingChart"></canvas>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Inference Mode -->
      <div class="tab-pane fade" id="inference" role="tabpanel">
        <div class="row">
          <div class="col-md-6">
            <div class="card">
              <div class="card-header">
                <h5 class="card-title mb-0">Model Selection</h5>
              </div>
              <div class="card-body">
                <form id="inferenceForm">
                  <div class="mb-3">
                    <label class="form-label">Select Trained Model</label>
                    <select class="form-select" name="model_path" required>
                      <option value="">Select a model...</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Upload Test Data</label>
                    <input type="file" class="form-control" name="test_data" required>
                  </div>
                  <button type="submit" class="btn btn-primary w-100">Run Inference</button>
                </form>
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="card">
              <div class="card-header">
                <h5 class="card-title mb-0">Inference Results</h5>
              </div>
              <div class="card-body">
                <div id="inferenceResults">
                  <p class="text-muted">Results will appear here after running inference.</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Initialize training chart
    const ctx = document.getElementById('trainingChart').getContext('2d');
    const trainingChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'Training Loss',
          data: [],
          borderColor: 'rgb(75, 192, 192)',
          tension: 0.1
        }, {
          label: 'Average Accuracy',
          data: [],
          borderColor: 'rgb(255, 99, 132)',
          tension: 0.1
        }]
      },
      options: {
        responsive: true,
        scales: {
          y: {
            beginAtZero: true
          }
        }
      }
    });

    // Initialize WebSocket connection when page loads
    const socket = io({
      transports: ['websocket'],
      upgrade: false
    });
    console.log("WebSocket connection initializing...");

    socket.on('connect', () => {
      console.log("WebSocket connected successfully");
    });

    socket.on('connect_error', (error) => {
      console.error("WebSocket connection error:", error);
    });

    socket.on('disconnect', (reason) => {
      console.log("WebSocket disconnected:", reason);
    });

    socket.on('training_update', function (data) {
      console.log("Received training update:", data);
      try {
        updateMetrics(data);
      } catch (error) {
        console.error("Error updating metrics:", error);
      }
    });

    // Handle training form submission
    document.getElementById('trainingForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const params = Object.fromEntries(formData.entries());

      // Construct command
      const command = `python system/main.py -data ${params.dataset} -m ${params.model} -algo ${params.algorithm} -gr ${params.global_rounds} -did ${params.device_id} -nc ${params.num_clients}` +
        ` -nclt ${params.num_clusters} -mu ${params.mu} -lambda_ ${params.lambda_} -lbs ${params.batch_size} -lr ${params.local_learning_rate}`;

      console.log("Starting training with command:", command);

      try {
        const response = await fetch('/start_training', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ command })
        });

        if (response.ok) {
          console.log("Training started successfully");
        } else {
          const errorText = await response.text();
          console.error("Failed to start training:", errorText);
          alert('Failed to start training: ' + errorText);
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Failed to start training: ' + error.message);
      }
    });

    function updateMetrics(data) {
      console.log("Updating metrics with data:", data);
      try {
        // Update metric cards
        document.getElementById('trainingTime').textContent = data.time.toFixed(2);
        document.getElementById('trainingLoss').textContent = data.loss.toFixed(4);
        document.getElementById('avgAccuracy').textContent = (data.avg_accuracy * 100).toFixed(2) + '%';
        document.getElementById('stdAccuracy').textContent = (data.std_accuracy * 100).toFixed(2) + '%';

        // Update chart
        trainingChart.data.labels.push(data.round);
        trainingChart.data.datasets[0].data.push(data.loss);
        trainingChart.data.datasets[1].data.push(data.avg_accuracy);
        trainingChart.update();
        console.log("Metrics updated successfully");
      } catch (error) {
        console.error("Error in updateMetrics:", error);
        throw error;
      }
    }
  </script>
</body>

</html>
